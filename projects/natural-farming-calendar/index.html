        styleMonthTip.textContent = `${selectedMonth}月：${style.month[selectedMonth]}`;
      }

      function eventDate(event) {
        const [hour, minute] = event.time.split(&quot;:&quot;).map(Number);
        return new Date(event.year, event.month - 1, event.day, hour, minute);
      }

      function moonStateForDay(year, month, day) {
        const noon = new Date(year, month - 1, day, 12, 0);
        const previous = moonEvents.filter(event =&gt; eventDate(event) &lt;= noon).at(-1);
        const previousNew = moonEvents.filter(event =&gt; event.type === &quot;new&quot; &amp;&amp; eventDate(event) &lt;= noon).at(-1);
        const exact = moonEvents.find(event =&gt; event.year === year &amp;&amp; event.month === month &amp;&amp; event.day === day);
        const segment = previous ? moonMeta[previous.type].segment : &quot;waxingLate&quot;;
        const age = previousNew ? (noon - eventDate(previousNew)) / 86400000 : null;
        return { segment, exact, age };
      }

      function lunarTargetForCrop(crop) {
        const rootLike = [&quot;potato&quot;,&quot;sweet-potato&quot;,&quot;taro&quot;,&quot;daikon&quot;,&quot;turnip&quot;,&quot;carrot&quot;,&quot;burdock&quot;,&quot;beet&quot;,&quot;radish&quot;,&quot;yacon&quot;,&quot;onion&quot;,&quot;garlic&quot;,&quot;scallion&quot;,&quot;chive&quot;,&quot;ginger&quot;,&quot;myoga&quot;,&quot;asparagus&quot;];
        if (crop.id === &quot;field&quot;) return &quot;waningLate&quot;;
        if (rootLike.includes(crop.id) || lifeById[crop.id] === &quot;perennial&quot;) return &quot;waningEarly&quot;;
        if (crop.group === &quot;果菜・瓜類&quot; || crop.group === &quot;豆類&quot;) return &quot;waxingLate&quot;;
        return &quot;waxingEarly&quot;;
      }

      function moonAgeGuide(age) {
        if (age == null) return { broad: false, label: &quot;月齢データなし&quot;, work: &quot;天候と作物の適期を優先&quot; };
        if (age &lt; 7.4) return { broad: true, label: &quot;新月期 0～7.3&quot;, work: &quot;伝統目安：葉物・茎物の播種候補&quot; };
        if (age &lt; 14.8) return { broad: true, label: &quot;満ちる月 7.4～14.7&quot;, work: &quot;伝統目安：果菜・豆類の播種・定植候補&quot; };
        if (age &lt;= 18) return { broad: true, label: &quot;満月後 14.8～18.0&quot;, work: &quot;伝統目安：根菜・球根類へ移る候補帯&quot; };
        if (age &lt; 22.1) return { broad: false, label: &quot;欠ける月 18.1～22.0&quot;, work: &quot;伝統目安：根菜・多年草の植え付け候補&quot; };
        return { broad: false, label: &quot;下弦期 22.1～29.5&quot;, work: &quot;伝統目安：草刈り・剪定・収穫・土の観察&quot; };
      }

      function renderLunarCalendar() {
        const crop = crops.find(item =&gt; item.id === selectedCropId) || crops[0];
        const targetSegment = lunarTargetForCrop(crop);
        const daysInMonth = new Date(selectedLunarYear, selectedMonth, 0).getDate();
        selectedLunarDay = Math.min(selectedLunarDay, daysInMonth);
        lunarTitle.textContent = `月の暦 ${selectedLunarYear}年${selectedMonth}月`;
        const nodes = [];
        [&quot;日&quot;,&quot;月&quot;,&quot;火&quot;,&quot;水&quot;,&quot;木&quot;,&quot;金&quot;,&quot;土&quot;].forEach(day =&gt; {
          const head = document.createElement(&quot;div&quot;);
          head.className = &quot;lunar-weekday&quot;;
          head.textContent = day;
          nodes.push(head);
        });
        const firstWeekday = new Date(selectedLunarYear, selectedMonth - 1, 1).getDay();
        for (let i = 0; i &lt; firstWeekday; i += 1) {
          const blank = document.createElement(&quot;div&quot;);
          blank.className = &quot;lunar-blank&quot;;
          blank.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
          nodes.push(blank);
        }
        for (let day = 1; day &lt;= daysInMonth; day += 1) {
          const state = moonStateForDay(selectedLunarYear, selectedMonth, day);
          const ageGuide = moonAgeGuide(state.age);
          const recommended = state.segment === targetSegment;
          const button = document.createElement(&quot;button&quot;);
          button.type = &quot;button&quot;;
          button.className = &quot;lunar-day&quot;;
          if (recommended) button.classList.add(&quot;is-recommended&quot;);
          if (ageGuide.broad) button.classList.add(&quot;is-broad-sowing&quot;);
          if (day === selectedLunarDay) button.classList.add(&quot;is-selected&quot;);
          const eventText = state.exact ? `${moonMeta[state.exact.type].label} ${state.exact.time}` : segmentMeta[state.segment].label;
          const ageText = state.age == null ? &quot;&quot; : `、正午月齢約${state.age.toFixed(1)}`;
          button.setAttribute(&quot;aria-label&quot;, `${selectedLunarYear}年${selectedMonth}月${day}日、${eventText}${ageText}${recommended ? `、${crop.name}の伝統的目安と一致` : &quot;&quot;}`);
          button.addEventListener(&quot;click&quot;, () =&gt; {
            selectedLunarDay = day;
            renderLunarCalendar();
          });
          const date = document.createElement(&quot;span&quot;);
          date.className = &quot;lunar-date&quot;;
          date.textContent = String(day);
          const moon = document.createElement(&quot;span&quot;);
          moon.className = &quot;moon-glyph&quot;;
          moon.textContent = state.exact ? moonMeta[state.exact.type].icon : segmentMeta[state.segment].icon;
          const age = document.createElement(&quot;span&quot;);
          age.className = &quot;lunar-age&quot;;
          age.textContent = `月齢 ${state.age?.toFixed(1) ?? &quot;—&quot;}`;
          const mark = document.createElement(&quot;span&quot;);
          mark.className = &quot;lunar-mark&quot;;
          mark.textContent = state.exact ? moonMeta[state.exact.type].label : (recommended ? &quot;○&quot; : &quot;&quot;);
          button.append(date, moon, age, mark);
          nodes.push(button);
        }
        lunarCalendar.replaceChildren(...nodes);

        const selectedState = moonStateForDay(selectedLunarYear, selectedMonth, selectedLunarDay);
        const selectedAgeGuide = moonAgeGuide(selectedState.age);
        const selectedEvent = selectedState.exact ? `${moonMeta[selectedState.exact.type].label} ${selectedState.exact.time}` : segmentMeta[selectedState.segment].label;
        const match = selectedState.segment === targetSegment;
        const values = [
          `${selectedLunarYear}/${selectedMonth}/${selectedLunarDay}`,
          selectedEvent,
          `正午区分：${segmentMeta[selectedState.segment].label}`,
          `正午月齢 約${selectedState.age?.toFixed(1) ?? &quot;—&quot;}`,
          `月齢帯：${selectedAgeGuide.label}`,
          selectedAgeGuide.work,
          `月齢0～18の広い播種候補：${selectedAgeGuide.broad ? &quot;該当&quot; : &quot;対象外&quot;}（経験的目安）`,
          `伝統目安：${segmentMeta[selectedState.segment].tradition}`,
          `${crop.name}：${match ? &quot;目安と一致&quot; : `目安は${segmentMeta[targetSegment].label}`}`
        ];
        lunarSelected.replaceChildren(...values.map((value, index) =&gt; {
          const span = document.createElement(&quot;span&quot;);
          span.className = index === 0 ? &quot;summary-name&quot; : &quot;viz-badge&quot;;
          span.textContent = value;
          return span;
        }));
      }

      function renderSummary() {
        const crop = crops.find(item =&gt; item.id === selectedCropId) || crops[0];
        const phases = phasesFor(crop, selectedMonth);
        const start = startMeta[startById[crop.id]];
        const life = lifeMeta[lifeById[crop.id]];

          selectedPhases.append(empty);
        }
        const conflictsWithNaturalBase = text =&gt; /(寒起こし|天地返し|深く耕|苦土石灰|元肥|追肥して|堆肥を)/.test(text || &quot;&quot;);
        const cropSpecific = [crop.notes[selectedMonth], crop.tip].filter(text =&gt; text &amp;&amp; !conflictsWithNaturalBase(text));
        const tips = [climateTips[selectedMonth], styleMeta[selectedStyle].month[selectedMonth], ...phases.map(phase =&gt; phaseTips[phase]), ...cropSpecific].filter(Boolean);
        selectedTips.replaceChildren(...[...new Set(tips)].slice(0, 5).map(text =&gt; {
          const li = document.createElement(&quot;li&quot;);
          li.textContent = text;
          return li;
        }));

      function renderMonthList() {
        const active = visibleCrops().map(crop =&gt; ({ crop, phases: phasesFor(crop, selectedMonth) })).filter(item =&gt; item.phases.length);
        monthTitle.textContent = `${selectedMonth}月の作業一覧`;
        monthCount.textContent = `${active.length}品目 / 表示${visibleCrops().length}品目`;
        monthList.replaceChildren(...active.map(item =&gt; {
          const row = document.createElement(&quot;button&quot;);
          row.type = &quot;button&quot;;
          row.className = &quot;btn btn-ghost month-item&quot;;

      function renderTimeline() {
        const rows = [];
        const header = document.createElement(&quot;div&quot;);
        header.className = &quot;timeline-row&quot;;

          });
          header.append(button);
        });
        rows.push(header);
        visibleCrops().forEach(crop =&gt; {
          const row = document.createElement(&quot;div&quot;);
          row.className = &quot;timeline-row&quot;;
          const head = document.createElement(&quot;button&quot;);

          head.className = &quot;btn btn-ghost row-head&quot;;

            selectedCropId = crop.id;

          const name = document.createElement(&quot;span&quot;);

          name.textContent = crop.name;
          const code = document.createElement(&quot;span&quot;);
          code.className = &quot;row-code&quot;;
          code.textContent = `${startMeta[startById[crop.id]].code}/${lifeMeta[lifeById[crop.id]].code}`;
          head.append(code, name);
          row.append(head);

            cell.addEventListener(&quot;click&quot;, () =&gt; {

      }

      function renderAll(sync = true) {
        if (sync) refreshCropSelect();

        renderStyleSummary();

      lunarYearSelect.addEventListener(&quot;change&quot;, event =&gt; { selectedLunarYear = Number(event.target.value); selectedLunarDay = 1; renderLunarCalendar(); });
    })();
